<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar">
            <h1>My Website</h1>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO -->
    <section class="hero">
        <h2>Responsive Web Layout</h2>
        <p>Using CSS Flexbox and Grid</p>
    </section>

    <!-- GALLERY -->
    <section class="gallery">

    <div class="card">
        <img src="images/1.jpeg" alt="Gallery Image">
    </div>

    <div class="card">
        <img src="images/2.jpeg" alt="Gallery Image">
    </div>

    <div class="card">
        <img src="images/3.jpeg" alt="Gallery Image">
    </div>

    <div class="card">
        <img src="images/4.jpeg" alt="Gallery Image">
    </div>

    <div class="card">
        <img src="images/5.jpeg" alt="Gallery Image">
    </div>

    <div class="card">
        <img src="images/6.jpeg" alt="Gallery Image">
    </div>

</section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Responsive Layout Example</p>
    </footer>

</body>

</html>
